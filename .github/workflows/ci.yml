name: ci

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  # Material 9.7 prints a banner about the upcoming MkDocs 2.0 rewrite on every
  # build. It is a notice from the theme's maintainer about upstream, not a
  # problem with this site, and it only makes the log harder to read.
  NO_MKDOCS_2_WARNING: "1"

jobs:
  deploy:
    # Every version here is pinned exactly, including the runner image: this
    # site is meant to keep deploying untouched for years, so nothing in the
    # build should be free to change on its own. Bumping is a deliberate edit.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      # uv installs the interpreter named in .python-version and the exact
      # package versions in uv.lock, so CI builds what was built locally. The
      # old setup resolved "mkdocs-material[imaging]" fresh on every deploy
      # against Python "3.x", which meant a new release upstream could break or
      # silently change the published site without a commit here.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v6.1.0
        with:
          key: mkdocs-material-${{ env.cache_id }}
          # The "social" plugin caches rendered cards in the repo's .cache
          # directory, not the home one, so this path is what makes card
          # generation incremental between runs.
          path: .cache
          restore-keys: |
            mkdocs-material-
      # The "social" plugin renders Open Graph cards through cairosvg and
      # Pillow, both of which bind to system libraries that the runner image
      # does not ship.
      - name: Install imaging system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev

      # --locked fails the build if uv.lock has drifted from pyproject.toml
      # rather than quietly resolving something new.
      - run: uv sync --locked
      # --strict turns MkDocs warnings (broken internal links, missing nav
      # pages) into failures, so a bad link stops the deploy instead of
      # shipping.
      - run: uv run mkdocs gh-deploy --force --strict
