site_name: vanderoost
site_description: I automate tech companies
site_url: https://vanderoost.com
# Gives every page a <meta name="author">; pages may override it per-page with
# an "author" key. overrides/main.html adds the article:* tags on top.
site_author: Richard van der Oost

nav:
  - About: index.md 
  - Articles:
      - articles/index.md
  - Case Studies:
    - Overview: portfolio/index.md
    - Projects:
      - portfolio/projects/clik-production-pipeline.md
      - portfolio/projects/blendergrid-swarm-engine.md

theme:
  name: material

  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.indexes
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.expand
    - navigation.sections
    - navigation.top
    - content.tooltips
    - content.tabs.link
    - content.code.copy
    - navigation.footer

  language: en

  palette:
    # Automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode


    # Light mode
    - media: "(prefers-color-scheme: light)"
      primary: custom

      toggle:
        icon: material/brightness-7
        name: Switch to dark mode


    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom

      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  font:
    text: Ubuntu
    code: JetBrains Mono

  favicon: assets/favicon.png
  icon:
    logo: branding/vanderoost-icon

  custom_dir: overrides

extra:
  generator: false
  social:
    - icon: fontawesome/solid/building
      link: https://blendergrid.com
    - icon: fontawesome/brands/github
      link: https://github.com/vanderoost
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@richardvdoost
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/richardvdoost/

extra_css:
  - stylesheets/extra.css
  - stylesheets/hero.css
plugins:
  - social:
      cards_layout_options:
        background_color: "#111111"
        # Not the header icon: that one colors itself with CSS variables, which
        # the card rasterizer cannot resolve. See docs/assets/social-logo.svg.
        logo: docs/assets/social-logo.svg
  - blog:
      blog_dir: articles
      authors_file: articles/.authors.yml
      blog_toc: true
      categories: true
      categories_allowed:
        - Automation
        - Development

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.critic
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - def_list
  - pymdownx.keys

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js

copyright: |
  &copy; 2026 <a href="https://www.linkedin.com/in/richardvdoost/" target="_blank" rel="noopener">Richard van der Oost</a>. All rights reserved.
